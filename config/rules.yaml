# Deterministic pre-LLM rules (spec §6.3). Generic and public: personal values (eligible
# places, minimum rate, excluded employer countries) live in private/profile.yaml.
# Rules read only short structured fields: title, company, location (text + structured
# restrictions), salary and posting date. No rule reads the description: free text is
# context-blind for regex, so it is left to the LLM stage.
version: "2026-10-09.6"     # bump on any change; stored with every rule decision
stale_days: 30
rate_margin: 0.10            # reject only when the stated ceiling is >10% below the floor
review_sample_size: 5        # rejected jobs per run sampled into review_queue (false-reject audit)
min_plausible_usd_per_hour: 2.0  # a stated ceiling below this is a parsing artefact, not a wage

# Approximate rates, refreshed by hand; rate_margin absorbs drift.
fx_to_usd:
  USD: 1.0
  EUR: 1.08
  GBP: 1.27
  CHF: 1.12
  CAD: 0.73
  AUD: 0.66
  NZD: 0.60
  PLN: 0.25
  CZK: 0.044
  SEK: 0.095
  NOK: 0.093
  DKK: 0.145
  INR: 0.012
  BRL: 0.18
  MXN: 0.055
  ILS: 0.27
  AED: 0.27
  SGD: 0.74
  JPY: 0.0067
  UAH: 0.024
  RUB: 0.011
hours_per_period: {hour: 1, day: 8, week: 40, month: 173.33, year: 2080}

# Canonical place code -> aliases. Short codes that are also ordinary words are listed in
# case_sensitive_aliases so "contact us only" is not read as "US only". Georgia is left out on
# purpose (country vs US state). State/region names that contain a country name are listed
# explicitly so the longer alias wins over "mexico"/"ireland" ("New Mexico", "Northern Ireland").
places:
  US: ["US", "U.S.", "USA", "U.S.A.", "united states", "united states of america", "new mexico"]

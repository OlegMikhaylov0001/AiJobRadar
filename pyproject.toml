[project]
name = "aijobradar"
version = "0.1.0"
description = "Personal remote-job monitor with LLM ranking"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "typer>=0.12",
  "beautifulsoup4>=4.13",  # 4.13+ ships type hints (mypy --strict)
  "defusedxml>=0.7",
  "rapidfuzz>=3.9",
  "pyyaml>=6.0",
]

[project.scripts]
aijobradar = "aijobradar.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijobradar"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs contain code samples that are not part of the package.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as default values; that is its API, not a mutable-default bug.
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

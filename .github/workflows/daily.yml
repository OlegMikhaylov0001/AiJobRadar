name: daily

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "At most N model calls (empty = config default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Claude Code (pinned)
        run: npm install --global @anthropic-ai/claude-code@2.1.287
      - name: Rules profile from secret
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
        run: |
          [ -n "$PROFILE_YAML" ] || { echo "PROFILE_YAML secret is empty" >&2; exit 1; }
          umask 077
          mkdir -p private
          printf '%s\n' "$PROFILE_YAML" > private/profile.yaml
      - name: Migrate, fetch, rules, score, deliver
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LIMIT: ${{ inputs.limit }}
        run: uv run aijobradar run --deliver --migrate ${LIMIT:+--limit "$LIMIT"}
